name: M4 Trusted Phone Shell

on:
  # Every branch, not only main. A gate that first runs after a change has
  # landed is not a gate on that change - the same reasoning fuzz-nightly.yml
  # already records for its own trigger. The other eight workflows run on
  # every push; these three did not, and a test could therefore be added,
  # labelled and merged without ever having been executed.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  shell-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build shell gates
        run: >-
          cmake --build --preset host-debug
          --target shell_task_model_test shell_activation_test shell_preview_policy_test
          shell_chrome_test shell_consent_test shell_unlock_test shell_credential_rule_test
          shell_lifecycle_control_test display_exact_activation_test
          shell_compositor_control_test compositor_shell_private_runtime_test
          shell_service_supervisor_test recovery_policy_test
          --parallel 2
      - name: Test shell gates
        run: ctest --preset host-debug --output-on-failure -L '^m4-shell$'

  shell-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m4-shell-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build shell gates
        run: >-
          cmake --build build/m4-shell-clang
          --target shell_task_model_test shell_activation_test shell_preview_policy_test
          shell_chrome_test shell_consent_test shell_unlock_test shell_credential_rule_test
          shell_lifecycle_control_test display_exact_activation_test
          shell_compositor_control_test compositor_shell_private_runtime_test
          shell_service_supervisor_test recovery_policy_test
          --parallel 2
      - name: Test shell gates
        run: ctest --test-dir build/m4-shell-clang --output-on-failure -L '^m4-shell$'

  shell-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake --preset host-asan
      - name: Build shell gates with sanitizers
        run: >-
          cmake --build --preset host-asan
          --target shell_task_model_test shell_activation_test shell_preview_policy_test
          shell_chrome_test shell_consent_test shell_unlock_test shell_credential_rule_test
          shell_lifecycle_control_test display_exact_activation_test
          shell_compositor_control_test compositor_shell_private_runtime_test
          shell_service_supervisor_test recovery_policy_test
          --parallel 2
      - name: Test shell gates with sanitizers
        run: ctest --preset host-asan --output-on-failure -L '^m4-shell$'

  shell-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build shell gates natively
        run: >-
          cmake --build --preset host-debug
          --target shell_task_model_test shell_activation_test shell_preview_policy_test
          shell_chrome_test shell_consent_test shell_unlock_test shell_credential_rule_test
          shell_lifecycle_control_test display_exact_activation_test
          shell_compositor_control_test compositor_shell_private_runtime_test
          shell_service_supervisor_test recovery_policy_test
          --parallel 2
      - name: Test shell gates natively
        run: ctest --preset host-debug --output-on-failure -L '^m4-shell$'
