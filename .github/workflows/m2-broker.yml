name: M2 Service Broker

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  broker-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
      - name: Build broker and runtime gates
        run: >-
          cmake --build --preset host-debug
          --target supervisor_shared_identity_test service_broker_test application_bootstrap_v2_test
          application_service_session_test app_manager_multi_service_broker_test
          app_manager_runtime_service_session_test
          --parallel 2
      - name: Test broker and runtime gates
        run: ctest --preset host-debug --output-on-failure -L '^(m2-broker|m2-runtime)$'

  broker-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure ASan and UBSan
        run: cmake --preset host-asan -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
      - name: Build broker and runtime gates with sanitizers
        run: >-
          cmake --build --preset host-asan
          --target supervisor_shared_identity_test service_broker_test application_bootstrap_v2_test
          application_service_session_test app_manager_multi_service_broker_test
          app_manager_runtime_service_session_test
          --parallel 2
      - name: Test broker and runtime gates with sanitizers
        run: ctest --preset host-asan --output-on-failure -L '^(m2-broker|m2-runtime)$'

  broker-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build/m2-broker-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build broker and runtime gates
        run: >-
          cmake --build build/m2-broker-clang
          --target supervisor_shared_identity_test service_broker_test application_bootstrap_v2_test
          application_service_session_test app_manager_multi_service_broker_test
          app_manager_runtime_service_session_test
          --parallel 2
      - name: Test broker and runtime gates
        run: ctest --test-dir build/m2-broker-clang --output-on-failure -L '^(m2-broker|m2-runtime)$'

  broker-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
      - name: Build broker and runtime gates natively
        run: >-
          cmake --build --preset host-debug
          --target supervisor_shared_identity_test service_broker_test application_bootstrap_v2_test
          application_service_session_test app_manager_multi_service_broker_test
          app_manager_runtime_service_session_test
          --parallel 2
      - name: Test broker and runtime gates natively
        run: ctest --preset host-debug --output-on-failure -L '^(m2-broker|m2-runtime)$'
