name: M1 Package and App Foundation

on:
  push:

jobs:
  package-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build M1 package and App Manager tests
        run: >-
          cmake --build --preset host-debug
          --target package_identity_test package_registry_test package_analyzer_test package_persistence_test
          application_principal_store_test application_sandbox_landlock_test
          app_manager_launch_test m1_test_app_v1 m1_test_app_v2 m1_test_app_v3 system.storage
          --parallel 2
      - name: Run M1 tests
        run: >-
          ctest --preset host-debug --output-on-failure
          -R '^(package_|application_|supervisor_app_manager_launch_test$)'

  package-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m1-package-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build M1 package and App Manager tests
        run: >-
          cmake --build build/m1-package-clang
          --target package_identity_test package_registry_test package_analyzer_test package_persistence_test
          application_principal_store_test application_sandbox_landlock_test
          app_manager_launch_test m1_test_app_v1 m1_test_app_v2 m1_test_app_v3 system.storage
          --parallel 2
      - name: Run M1 tests
        run: >-
          ctest --test-dir build/m1-package-clang --output-on-failure
          -R '^(package_|application_|supervisor_app_manager_launch_test$)'

  package-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build M1 package and App Manager tests natively
        run: >-
          cmake --build --preset host-debug
          --target package_identity_test package_registry_test package_analyzer_test package_persistence_test
          application_principal_store_test application_sandbox_landlock_test
          app_manager_launch_test m1_test_app_v1 m1_test_app_v2 m1_test_app_v3 system.storage
          --parallel 2
      - name: Run M1 tests natively
        run: >-
          ctest --preset host-debug --output-on-failure
          -R '^(package_|application_|supervisor_app_manager_launch_test$)'
