name: M1 Package Foundation

on:
  push:
  pull_request:

jobs:
  package-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build package library and tests
        run: cmake --build --preset host-debug --target package_identity_test package_registry_test package_analyzer_test package_persistence_test --parallel 2
      - name: Run package tests
        run: ctest --preset host-debug --output-on-failure -R '^package_'

  package-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m1-package-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build package library and tests
        run: >-
          cmake --build build/m1-package-clang
          --target package_identity_test package_registry_test package_analyzer_test package_persistence_test
          --parallel 2
      - name: Run package tests
        run: ctest --test-dir build/m1-package-clang --output-on-failure -R '^package_'

  package-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build package library and tests natively
        run: cmake --build --preset host-debug --target package_identity_test package_registry_test package_analyzer_test package_persistence_test --parallel 2
      - name: Run package tests natively
        run: ctest --preset host-debug --output-on-failure -R '^package_'
