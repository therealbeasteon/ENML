name: M3 Semantic UI

on:
  # Every branch, not only main. A gate that first runs after a change has
  # landed is not a gate on that change - the same reasoning fuzz-nightly.yml
  # already records for its own trigger. The other eight workflows run on
  # every push; these three did not, and a test could therefore be added,
  # labelled and merged without ever having been executed.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ui-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install production text backend dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libfreetype6-dev libharfbuzz-dev libicu-dev fonts-dejavu-core
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_LINUX_TEXT_BACKEND=ON
      - name: Build semantic UI gates
        run: >-
          cmake --build --preset host-debug
          --target ui_semantic_tree_test ui_responsive_layout_test ui_decision_layout_test ui_contrast_test
          ui_render_snapshot_test ui_collection_window_test ui_collection_content_test
          ui_collection_changes_test collection_transport_test collection_session_test
          ui_design_reflow_test ui_renderer_command_test ui_render_damage_test
          ui_text_layout_test ui_paragraph_layout_test ui_raster_test
          ui_contour_aa_test ui_glyph_raster_test ui_text_command_raster_test
          ui_linux_text_backend_test
          ui_input_transform_test ui_input_routing_test ui_accessibility_bridge_test
          accessibility_transport_test accessibility_session_channel_test
          accessibility_control_test accessibility_service_supervisor_test
          ui_motion_timeline_test
          --parallel 2
      - name: Test semantic UI gates
        run: ctest --preset host-debug --output-on-failure -L '^m3-ui$'

  ui-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install production text backend dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libfreetype6-dev libharfbuzz-dev libicu-dev fonts-dejavu-core
      - name: Configure ASan and UBSan
        run: cmake --preset host-asan -DEMNL_BUILD_LINUX_TEXT_BACKEND=ON
      - name: Build semantic UI gates with sanitizers
        run: >-
          cmake --build --preset host-asan
          --target ui_semantic_tree_test ui_responsive_layout_test ui_decision_layout_test ui_contrast_test
          ui_render_snapshot_test ui_collection_window_test ui_collection_content_test
          ui_collection_changes_test collection_transport_test collection_session_test
          ui_design_reflow_test ui_renderer_command_test ui_render_damage_test
          ui_text_layout_test ui_paragraph_layout_test ui_raster_test
          ui_contour_aa_test ui_glyph_raster_test ui_text_command_raster_test
          ui_linux_text_backend_test
          ui_input_transform_test ui_input_routing_test ui_accessibility_bridge_test
          accessibility_transport_test accessibility_session_channel_test
          accessibility_control_test accessibility_service_supervisor_test
          ui_motion_timeline_test
          --parallel 2
      - name: Test semantic UI gates with sanitizers
        run: ctest --preset host-asan --output-on-failure -L '^m3-ui$'

  ui-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install production text backend dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libfreetype6-dev libharfbuzz-dev libicu-dev fonts-dejavu-core
      - name: Configure
        run: >-
          cmake -S . -B build/m3-ui-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DEMNL_BUILD_LINUX_TEXT_BACKEND=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build semantic UI gates
        run: >-
          cmake --build build/m3-ui-clang
          --target ui_semantic_tree_test ui_responsive_layout_test ui_decision_layout_test ui_contrast_test
          ui_render_snapshot_test ui_collection_window_test ui_collection_content_test
          ui_collection_changes_test collection_transport_test collection_session_test
          ui_design_reflow_test ui_renderer_command_test ui_render_damage_test
          ui_text_layout_test ui_paragraph_layout_test ui_raster_test
          ui_contour_aa_test ui_glyph_raster_test ui_text_command_raster_test
          ui_linux_text_backend_test
          ui_input_transform_test ui_input_routing_test ui_accessibility_bridge_test
          accessibility_transport_test accessibility_session_channel_test
          accessibility_control_test accessibility_service_supervisor_test
          ui_motion_timeline_test
          --parallel 2
      - name: Test semantic UI gates
        run: ctest --test-dir build/m3-ui-clang --output-on-failure -L '^m3-ui$'

  ui-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Install production text backend dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libfreetype6-dev libharfbuzz-dev libicu-dev fonts-dejavu-core
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_LINUX_TEXT_BACKEND=ON
      - name: Build semantic UI gates natively
        run: >-
          cmake --build --preset host-debug
          --target ui_semantic_tree_test ui_responsive_layout_test ui_decision_layout_test ui_contrast_test
          ui_render_snapshot_test ui_collection_window_test ui_collection_content_test
          ui_collection_changes_test collection_transport_test collection_session_test
          ui_design_reflow_test ui_renderer_command_test ui_render_damage_test
          ui_text_layout_test ui_paragraph_layout_test ui_raster_test
          ui_contour_aa_test ui_glyph_raster_test ui_text_command_raster_test
          ui_linux_text_backend_test
          ui_input_transform_test ui_input_routing_test ui_accessibility_bridge_test
          accessibility_transport_test accessibility_session_channel_test
          accessibility_control_test accessibility_service_supervisor_test
          ui_motion_timeline_test
          --parallel 2
      - name: Test semantic UI gates natively
        run: ctest --preset host-debug --output-on-failure -L '^m3-ui$'
