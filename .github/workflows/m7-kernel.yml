name: M7 Kernel

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  kernel-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux coupling ceiling
        run: .github/scripts/check-linux-coupling.sh 'kernel-gcc'
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel gates
        run: >-
          .github/scripts/run-build.sh 'kernel-gcc' --preset host-debug --parallel 2
      - name: Test kernel gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-gcc' --preset host-debug

  kernel-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build kernel gates with sanitizers
        run: >-
          .github/scripts/run-build.sh 'kernel-sanitizers' --preset host-asan --parallel 2
      - name: Test kernel gates with sanitizers
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-sanitizers' --preset host-asan

  kernel-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Clang
        run: >-
          cmake -S . -B build/m5-kernel-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build kernel gates
        run: >-
          .github/scripts/run-build.sh 'kernel-clang' build/m5-kernel-clang --parallel 2
      - name: Test kernel gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-clang' --test-dir build/m5-kernel-clang

  kernel-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
      - name: Install QEMU system emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Configure native kernel and freestanding image
        run: >-
          cmake -S . -B build/m7-arm64-native -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DEMNL_BUILD_AARCH64_BOOT_IMAGE=ON
      - name: Build all kernel gates and standalone image
        run: >-
          .github/scripts/run-build.sh 'kernel-arm64-native' build/m7-arm64-native --parallel 2
      - name: Test kernel gates natively
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-arm64-native' --test-dir build/m7-arm64-native
      - name: Boot Cookie Kernel under QEMU virt
        shell: bash
        run: |
          set -euo pipefail
          image=build/m7-arm64-native/core/oskernel/cookie_kernel_aarch64_boot.bin
          test -s "$image"
          set +e
          timeout 12s qemu-system-aarch64 \
            -machine virt,virtualization=off \
            -cpu cortex-a72 \
            -m 512M \
            -nographic \
            -monitor none \
            -d cpu_reset,guest_errors,int,in_asm \
            -D cookie-qemu-debug.log \
            -kernel "$image" >cookie-qemu.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            cat cookie-qemu.log
            exit "$status"
          fi
          cat cookie-qemu.log
          echo '--- executed blocks, and whether any are in the linked image ---'
          grep -c '^IN: ' cookie-qemu-debug.log || true
          grep -m 8 -E '^0x40[0-9a-f]{6}' cookie-qemu-debug.log || echo 'NOTHING EXECUTED AT 0x40xxxxxx'
          echo '--- first 40 lines of the trace ---'
          head -n 40 cookie-qemu-debug.log || true
          # Report the stage the kernel rejected before reporting the marker it
          # never printed. A bare grep for the success marker says only that
          # boot did not finish, which is the one thing already known.
          if grep -F 'COOKIE:PANIC:' cookie-qemu.log; then
            echo '--- kernel reported the stage above and halted ---'
            exit 1
          fi
          grep -F 'COOKIE:M7.5d:MMU' cookie-qemu.log
          grep -F 'COOKIE:M7.5d:GUARDED' cookie-qemu.log
