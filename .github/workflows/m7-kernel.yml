name: M7 Kernel

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  kernel-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux coupling ceiling
        run: .github/scripts/check-linux-coupling.sh 'kernel-gcc'
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel gates
        run: >-
          .github/scripts/run-build.sh 'kernel-gcc' --preset host-debug --target
          kernel_abi_test kernel_rendezvous_test kernel_ipc_endpoint_test kernel_ipc_context_bound_test kernel_ipc_composition_test kernel_ipc_continuation_test kernel_machine_host_test
          kernel_process_translation_test kernel_user_access_test kernel_aarch64_user_copy_guard_test
          kernel_aarch64_contract_test kernel_aarch64_exception_test
          kernel_aarch64_user_frames_test kernel_aarch64_preemption_test
          kernel_aarch64_translation_test kernel_aarch64_kernel_translation_domain_test kernel_aarch64_asid_test kernel_aarch64_page_tables_test
          kernel_aarch64_mapping_state_test kernel_fault_region_test kernel_fdt_test
          kernel_hardware_inventory_test kernel_gic_v3_discovery_test
          kernel_arch_timer_discovery_test kernel_boot_memory_test
          kernel_boot_memory_plan_test kernel_capability_test kernel_context_bound_capability_test kernel_interrupt_test kernel_interrupt_delivery_test
          kernel_scheduler_test kernel_scheduler_deadline_test kernel_composition_test --parallel 2
      - name: Test kernel gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-gcc' --preset host-debug

  kernel-line-count:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kernel line-count ceiling
        run: .github/scripts/kernel-line-count.sh 'kernel-line-count'

  kernel-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build kernel gates with sanitizers
        run: >-
          .github/scripts/run-build.sh 'kernel-sanitizers' --preset host-asan --target
          kernel_abi_test kernel_rendezvous_test kernel_ipc_endpoint_test kernel_ipc_context_bound_test kernel_ipc_composition_test kernel_ipc_continuation_test kernel_machine_host_test
          kernel_process_translation_test kernel_user_access_test kernel_aarch64_user_copy_guard_test
          kernel_aarch64_contract_test kernel_aarch64_exception_test
          kernel_aarch64_user_frames_test kernel_aarch64_preemption_test
          kernel_aarch64_translation_test kernel_aarch64_kernel_translation_domain_test kernel_aarch64_asid_test kernel_aarch64_page_tables_test
          kernel_aarch64_mapping_state_test kernel_fault_region_test kernel_fdt_test
          kernel_hardware_inventory_test kernel_gic_v3_discovery_test
          kernel_arch_timer_discovery_test kernel_boot_memory_test kernel_boot_memory_plan_test kernel_capability_test kernel_context_bound_capability_test kernel_interrupt_test kernel_interrupt_delivery_test
          kernel_scheduler_test kernel_scheduler_deadline_test kernel_composition_test --parallel 2
      - name: Test kernel gates with sanitizers
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-sanitizers' --preset host-asan

  kernel-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Clang
        run: >-
          cmake -S . -B build/m5-kernel-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build kernel gates
        run: >-
          .github/scripts/run-build.sh 'kernel-clang' build/m5-kernel-clang --target
          kernel_abi_test kernel_rendezvous_test kernel_ipc_endpoint_test kernel_ipc_context_bound_test kernel_ipc_composition_test kernel_ipc_continuation_test kernel_machine_host_test
          kernel_process_translation_test kernel_user_access_test kernel_aarch64_user_copy_guard_test
          kernel_aarch64_contract_test kernel_aarch64_exception_test
          kernel_aarch64_user_frames_test kernel_aarch64_preemption_test
          kernel_aarch64_translation_test kernel_aarch64_kernel_translation_domain_test kernel_aarch64_asid_test kernel_aarch64_page_tables_test
          kernel_aarch64_mapping_state_test kernel_fault_region_test kernel_fdt_test
          kernel_hardware_inventory_test kernel_gic_v3_discovery_test
          kernel_arch_timer_discovery_test kernel_boot_memory_test
          kernel_boot_memory_plan_test kernel_capability_test kernel_context_bound_capability_test kernel_interrupt_test kernel_interrupt_delivery_test
          kernel_scheduler_test kernel_scheduler_deadline_test kernel_composition_test --parallel 2
      - name: Test kernel gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-clang' --test-dir build/m5-kernel-clang

  kernel-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
      - name: Install QEMU system emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Configure native kernel and freestanding image
        run: >-
          cmake -S . -B build/m7-arm64-native -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DEMNL_BUILD_AARCH64_BOOT_IMAGE=ON
      - name: Build all kernel gates and standalone image
        run: >-
          .github/scripts/run-build.sh 'kernel-arm64-native' build/m7-arm64-native --target
          kernel_abi_test kernel_rendezvous_test kernel_ipc_endpoint_test kernel_ipc_context_bound_test kernel_ipc_composition_test kernel_ipc_continuation_test kernel_machine_host_test
          kernel_process_translation_test kernel_user_access_test kernel_aarch64_user_copy_guard_test
          kernel_aarch64_contract_test kernel_aarch64_exception_test
          kernel_aarch64_user_frames_test kernel_aarch64_preemption_test
          kernel_aarch64_translation_test kernel_aarch64_kernel_translation_domain_test kernel_aarch64_asid_test kernel_aarch64_page_tables_test
          kernel_aarch64_mapping_state_test kernel_fault_region_test kernel_fdt_test
          kernel_hardware_inventory_test kernel_gic_v3_discovery_test
          kernel_arch_timer_discovery_test kernel_boot_memory_test
          kernel_boot_memory_plan_test kernel_capability_test kernel_context_bound_capability_test kernel_interrupt_test kernel_interrupt_delivery_test
          kernel_scheduler_test kernel_scheduler_deadline_test kernel_composition_test
          oskernel_machine_aarch64 cookie_kernel_aarch64_boot --parallel 2
      - name: Test kernel gates natively
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-arm64-native' --test-dir build/m7-arm64-native
      - name: Inspect freestanding image layout
        run: |
          set -euo pipefail
          elf=build/m7-arm64-native/core/oskernel/cookie_kernel_aarch64_boot
          image=${elf}.bin
          test -s "$elf"
          test -s "$image"
          entry=$(readelf -h "$elf" | awk '/Entry point address:/ {print $4}')
          boot_main=$(nm -n "$elf" | awk '$3 == "cookie_aarch64_boot_main" {print "0x"$1}')
          test -n "$entry"
          test -n "$boot_main"
          readelf -h "$elf"
          readelf -l "$elf"
          readelf -S "$elf"
          readelf -r "$elf"
          nm -n "$elf" | grep -E '(_start|cookie_aarch64_boot_main|__cookie_image_start|__cookie_image_end|__bss_start|__bss_end|__cookie_bootstrap_stack_top)$'
          echo '--- _start ---'
          objdump -d --start-address="$entry" --stop-address=$((entry + 0x120)) "$elf" || true
          echo '--- cookie_aarch64_boot_main prologue ---'
          objdump -d --start-address="$boot_main" --stop-address=$((boot_main + 0x100)) "$elf" || true
          echo '--- reject accidental FP/SIMD before kernel context support exists ---'
          if objdump -d "$elf" | grep -Eq '\b(q[0-9]+|v[0-9]+\.)\b'; then
            echo 'freestanding Cookie kernel unexpectedly contains FP/SIMD register use' >&2
            objdump -d "$elf" | grep -E '\b(q[0-9]+|v[0-9]+\.)\b' | head -n 40 >&2 || true
            exit 1
          fi
          stat -c 'raw-image-bytes=%s' "$image"
      - name: Boot Cookie Kernel as bare-metal ELF and prove isolated EL0 native IPC under QEMU virt GICv3
        shell: bash
        run: |
          set -euo pipefail
          elf=build/m7-arm64-native/core/oskernel/cookie_kernel_aarch64_boot
          test -s "$elf"
          set +e
          timeout 12s qemu-system-aarch64 \
            -machine virt,gic-version=3,virtualization=off \
            -cpu cortex-a72 \
            -m 512M \
            -nographic \
            -monitor none \
            -no-reboot \
            -d cpu_reset,guest_errors,int,in_asm \
            -D cookie-qemu-debug.log \
            -device loader,file="$elf",cpu-num=0 >cookie-qemu.log 2>&1
          status=$?
          set -e
          cat cookie-qemu.log
          echo '--- QEMU first-exception instruction window ---'
          first_exception=$(grep -n -m1 'Taking exception' cookie-qemu-debug.log | cut -d: -f1 || true)
          if [[ -n "$first_exception" ]]; then
            begin=$(( first_exception > 140 ? first_exception - 140 : 1 ))
            end=$(( first_exception + 25 ))
            sed -n "${begin},${end}p" cookie-qemu-debug.log || true
          else
            tail -n 260 cookie-qemu-debug.log || true
          fi
          echo '--- QEMU diagnostic tail ---'
          tail -n 80 cookie-qemu-debug.log || true
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit "$status"
          fi
          cat cookie-qemu.log
          echo '--- executed blocks, and whether any are in the linked image ---'
          grep -c '^IN: ' cookie-qemu-debug.log || true
          grep -m 8 -E '^0x40[0-9a-f]{6}' cookie-qemu-debug.log || echo 'NOTHING EXECUTED AT 0x40xxxxxx'
          echo '--- first 40 lines of the trace ---'
          head -n 40 cookie-qemu-debug.log || true
          # Every executed block, not only those inside the image. Filtering to
          # 0x40xxxxxx hides the one thing most worth seeing: execution that
          # left the kernel entirely. A fault taken before VBAR_EL1 is set goes
          # to whatever the reset value points at, and on this board that is
          # not an address the image occupies.
          echo '--- blocks executed OUTSIDE the kernel image ---'
          grep -oE '^0x[0-9a-f]+' cookie-qemu-debug.log | sort -u \
            | grep -vE '^0x40[0-9a-f]{6}$' || echo 'none - execution stayed in the image'
          echo '--- last 30 blocks in execution order ---'
          grep -oE '^0x[0-9a-f]+' cookie-qemu-debug.log | tail -30 | uniq -c
          echo '--- executed blocks, resolved ---'
          elf=build/m7-arm64-native/core/oskernel/cookie_kernel_aarch64_boot
          for pc in $(grep -oE '^0x40[0-9a-f]{6}' cookie-qemu-debug.log | sort -u); do
            printf '%s  %s\n' "$pc" "$(addr2line -f -C -e "$elf" "$pc" | tr '\n' ' ')"
          done
          # The bootstrap stack is fixed at link time and the frames that have
          # to fit in it are not, so print the largest ones. A frame that
          # overruns this stack does not fault - translation is off and
          # .rodata/.text lie below it - so the failure appears as corrupted
          # code rather than as a stack error.
          echo '--- largest stack frames in the boot image ---'
          objdump -d "$elf" | awk '
            /^[0-9a-f]+ </ { fn=$2 }
            /sub[ \t]+sp, sp, #/ {
              n=$NF; sub(/^#/,"",n); sub(/,.*/,"",n);
              if (n+0 > 512) printf "%8d  %s\n", n, fn
            }' | sort -rn | head -10
          echo "bootstrap stack bytes: $(nm "$elf" | awk '
            /__cookie_bootstrap_stack_start/ { s=strtonum("0x" $1) }
            /__cookie_bootstrap_stack_top/   { t=strtonum("0x" $1) }
            END { print t-s }')"
          echo '--- image extent (note: BSS is not in the .bin QEMU loads) ---'
          readelf -lW "$elf" | sed -n '/Program Head/,/Section to Segment/p'
          size -A -d "$elf" | head -20
          # Report the stage the kernel rejected before reporting the marker it
          # never printed. A bare grep for the success marker says only that
          # boot did not finish, which is the one thing already known.
          if grep -F 'COOKIE:PANIC:' cookie-qemu.log; then
            echo '--- kernel reported the stage above and halted ---'
            exit 1
          fi
          grep -F 'COOKIE:M7.5d:MMU' cookie-qemu.log
          grep -F 'COOKIE:M7.5d:GUARDED' cookie-qemu.log
          grep -F 'COOKIE:M7.5f:EL0_SVC_RETURN' cookie-qemu.log
          grep -F 'COOKIE:M7.5g:GICV3' cookie-qemu.log
          grep -F 'COOKIE:M7.5g:TIMER_IRQ' cookie-qemu.log
          grep -F 'COOKIE:M7.5g:TIMER_IRQ_RETURN' cookie-qemu.log
          grep -F 'COOKIE:M7.5i:CONTENTION_ARMED' cookie-qemu.log
          grep -F 'COOKIE:M7.5i:A_TO_B' cookie-qemu.log
          grep -F 'COOKIE:M7.5i:B_TO_A' cookie-qemu.log
          grep -F 'COOKIE:M7.5i:ISOLATED_A_B_A' cookie-qemu.log
          grep -F 'COOKIE:M7.6:IPC_RECEIVER_FIRST' cookie-qemu.log
          grep -F 'COOKIE:M7.6:IPC_REQUEST_B' cookie-qemu.log
          grep -F 'COOKIE:M7.6:IPC_A_B_REPLY' cookie-qemu.log
          grep -F 'COOKIE:M7.9:ATTACHED' cookie-qemu.log
          grep -F 'COOKIE:M7.9:DISPATCHED' cookie-qemu.log
          grep -F 'COOKIE:M7.9:SERVICED' cookie-qemu.log
          grep -F 'COOKIE:M7.9:COMPLETED' cookie-qemu.log
