name: M7 Kernel

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The migration off Linux only finishes if the surface can only shrink.
      - name: Linux coupling ceiling
        run: .github/scripts/check-linux-coupling.sh 'kernel-gcc'
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel ABI gates
        run: .github/scripts/run-build.sh 'kernel-gcc' --preset host-debug --target kernel_abi_test kernel_rendezvous_test --parallel 2
      - name: Test kernel ABI gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-gcc' --preset host-debug

  kernel-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build kernel ABI gates with sanitizers
        run: .github/scripts/run-build.sh 'kernel-sanitizers' --preset host-asan --target kernel_abi_test kernel_rendezvous_test --parallel 2
      - name: Test kernel ABI gates with sanitizers
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-sanitizers' --preset host-asan

  kernel-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Clang
        run: >-
          cmake -S . -B build/m5-kernel-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build kernel ABI gates
        run: .github/scripts/run-build.sh 'kernel-clang' build/m5-kernel-clang --target kernel_abi_test kernel_rendezvous_test --parallel 2
      - name: Test kernel ABI gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-clang' --test-dir build/m5-kernel-clang

  # A device access policy describes physical address windows, so its parser
  # handles 64-bit addresses and lengths at the edge of the address space. That
  # arithmetic, and the explicitly little-endian encoding, must hold on the
  # primary target architecture and not merely on the build host.
  kernel-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel ABI gates natively
        run: .github/scripts/run-build.sh 'kernel-arm64-native' --preset host-debug --target kernel_abi_test kernel_rendezvous_test --parallel 2
      - name: Test kernel ABI gates natively
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-arm64-native' --preset host-debug
