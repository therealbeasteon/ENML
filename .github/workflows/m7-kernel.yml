name: M7 Kernel

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  kernel-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The migration off Linux only finishes if the surface can only shrink.
      - name: Linux coupling ceiling
        run: .github/scripts/check-linux-coupling.sh 'kernel-gcc'
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel ABI gates
        run: .github/scripts/run-build.sh 'kernel-gcc' --preset host-debug --parallel 2
      - name: Test kernel ABI gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-gcc' --preset host-debug

  kernel-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build kernel ABI gates with sanitizers
        run: .github/scripts/run-build.sh 'kernel-sanitizers' --preset host-asan --parallel 2
      - name: Test kernel ABI gates with sanitizers
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-sanitizers' --preset host-asan

  kernel-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Clang
        run: >-
          cmake -S . -B build/m5-kernel-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build kernel ABI gates
        run: .github/scripts/run-build.sh 'kernel-clang' build/m5-kernel-clang --parallel 2
      - name: Test kernel ABI gates
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-clang' --test-dir build/m5-kernel-clang

  # The real AArch64 machine backend is compiled here in addition to the hosted
  # contract tests. It is not yet linked into a boot image: unsupported machine
  # operations must remain visibly unsupported until their hardware mechanism is
  # implemented rather than being hidden behind a host stub.
  kernel-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build kernel ABI gates and real AArch64 machine slice natively
        run: .github/scripts/run-build.sh 'kernel-arm64-native' --preset host-debug --parallel 2
      - name: Test kernel ABI gates natively
        run: .github/scripts/run-ctest.sh '^m7-kernel$' 'kernel-arm64-native' --preset host-debug
