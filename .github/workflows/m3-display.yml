name: M3 Display and Compositor

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  display-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build display gate
        run: cmake --build --preset host-debug --target display_compositor_test --parallel 2
      - name: Test display gate
        run: ctest --preset host-debug --output-on-failure -L '^m3-display$'

  display-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake --preset host-asan
      - name: Build display gate with sanitizers
        run: cmake --build --preset host-asan --target display_compositor_test --parallel 2
      - name: Test display gate with sanitizers
        run: ctest --preset host-asan --output-on-failure -L '^m3-display$'

  display-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m3-display-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build display gate
        run: cmake --build build/m3-display-clang --target display_compositor_test --parallel 2
      - name: Test display gate
        run: ctest --test-dir build/m3-display-clang --output-on-failure -L '^m3-display$'

  display-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build display gate natively
        run: cmake --build --preset host-debug --target display_compositor_test --parallel 2
      - name: Test display gate natively
        run: ctest --preset host-debug --output-on-failure -L '^m3-display$'
