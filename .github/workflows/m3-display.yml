name: M3 Display and Compositor

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  display-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build display gates
        run: >-
          cmake --build --preset host-debug
          --target display_compositor_test display_input_hit_test display_input_authority_test
          display_shared_buffer_test display_generation_namespace_test display_trusted_overlay_test
          display_trusted_mark_test display_exact_activation_test compositor_service_integration_test
          input_service_transport_test application_service_session_test application_input_event_test
          emnl_app_manager
          --parallel 2
      - name: Test display gates
        run: ctest --preset host-debug --output-on-failure -L '^m3-display$'

  display-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake --preset host-asan
      - name: Build display gates with sanitizers
        run: >-
          cmake --build --preset host-asan
          --target display_compositor_test display_input_hit_test display_input_authority_test
          display_shared_buffer_test display_generation_namespace_test display_trusted_overlay_test
          display_trusted_mark_test display_exact_activation_test compositor_service_integration_test
          input_service_transport_test application_service_session_test application_input_event_test
          emnl_app_manager
          --parallel 2
      - name: Test display gates with sanitizers
        run: ctest --preset host-asan --output-on-failure -L '^m3-display$'

  display-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m3-display-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build display gates
        run: >-
          cmake --build build/m3-display-clang
          --target display_compositor_test display_input_hit_test display_input_authority_test
          display_shared_buffer_test display_generation_namespace_test display_trusted_overlay_test
          display_trusted_mark_test display_exact_activation_test compositor_service_integration_test
          input_service_transport_test application_service_session_test application_input_event_test
          emnl_app_manager
          --parallel 2
      - name: Test display gates
        run: ctest --test-dir build/m3-display-clang --output-on-failure -L '^m3-display$'

  display-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build display gates natively
        run: >-
          cmake --build --preset host-debug
          --target display_compositor_test display_input_hit_test display_input_authority_test
          display_shared_buffer_test display_generation_namespace_test display_trusted_overlay_test
          display_trusted_mark_test display_exact_activation_test compositor_service_integration_test
          input_service_transport_test application_service_session_test application_input_event_test
          emnl_app_manager
          --parallel 2
      - name: Test display gates natively
        run: ctest --preset host-debug --output-on-failure -L '^m3-display$'
