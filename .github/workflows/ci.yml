name: M0 CI

on:
  push:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug --parallel 2
      - name: Test
        run: ctest --preset host-debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build
        run: cmake --build --preset host-asan --parallel 2
      - name: Test
        run: ctest --preset host-asan --output-on-failure

  clang-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/host-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/host-clang --parallel 2
      - name: Test
        run: ctest --test-dir build/host-clang --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          -DEMNL_BUILD_FUZZING=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/fuzz --parallel 2
      - name: IPC decoder smoke
        run: ASAN_OPTIONS=detect_leaks=0 ./build/fuzz/fuzz/ipc_decoder_fuzz -runs=1000
      - name: OSIDL compiler smoke
        run: ASAN_OPTIONS=detect_leaks=0 ./build/fuzz/fuzz/osidlc_compiler_fuzz -runs=1000
      - name: RPC error envelope smoke
        run: ASAN_OPTIONS=detect_leaks=0 ./build/fuzz/fuzz/rpc_error_fuzz -runs=1000
      - name: Package manifest analyzer smoke
        run: ASAN_OPTIONS=detect_leaks=0 ./build/fuzz/fuzz/package_manifest_fuzz -runs=5000

  arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -a
          uname -m | tee arm64-machine.txt
          test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build complete M0 userspace natively on AArch64
        run: cmake --build --preset host-debug --parallel 2
      - name: Test complete M0 userspace natively on AArch64
        run: ctest --preset host-debug --output-on-failure

  arm64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross compiler and QEMU user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-g++ --version | head -1
          qemu-aarch64 --version | head -1
      - name: Build host OSIDL compiler
        run: |
          cmake --preset host-tools
          cmake --build --preset host-tools --target osidlc --parallel 2
          ./build/host-tools/tools/osidlc/osidlc --version
      - name: Configure AArch64 cross build
        run: cmake --preset arm64-debug
      - name: Cross-build complete M0 userspace
        shell: bash
        run: |
          set +e
          cmake --build --preset arm64-debug --parallel 2 > cross-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- compact cross-build diagnostics ---'
            grep -nE '(^| )(error:|fatal error:|warning:)' cross-build.log | tail -120 || true
            echo '--- final build lines ---'
            tail -40 cross-build.log
            exit "$status"
          fi
          cat cross-build.log
      - name: Run explicitly QEMU-user-safe AArch64 tests
        run: >-
          ctest --preset arm64-debug --output-on-failure
          -L qemu-user-safe
