name: M0 CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Added while the count is zero. A gate written after the debt exists
      # starts life failing and gets suppressed; one written at zero only ever
      # has to hold a line.
      - name: Hygiene
        run: .github/scripts/check-hygiene.sh 'debug'
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: .github/scripts/run-build.sh 'debug' --preset host-debug --parallel 2
      - name: Test M0 only
        run: ctest --preset host-debug --output-on-failure -L '^m0$'
      # Feature-testing a flag proves the compiler accepted it, not that the
      # mitigation reached the artifact. Checked against real service binaries
      # rather than a trivial test, so the stack-protector check is meaningful.
      # Distinguishes "the flag never reached the compile line" from "the flag
      # was applied and instrumented nothing", which the ELF alone cannot.
      - name: Report hardening flags in the build
        run: |
          report=""
          for flag in fstack-protector-strong fstack-clash-protection mbranch-protection fcf-protection _GLIBCXX_ASSERTIONS; do
            count="$(grep -c -- "$flag" build/host-debug/build.ninja || true)"
            report="${report}${flag} -> ${count} occurrences%0A"
          done
          sample="$(grep -m1 -o -- '-fstack-protector[^ ]*' build/host-debug/build.ninja || echo NONE)"
          report="${report}first stack-protector token seen: ${sample}"
          echo "::notice title=hardening flags::${report}"
      - name: Verify binary hardening
        run: >-
          .github/scripts/check-hardening.sh 'host-debug'
          $(find build/host-debug -type f -perm -u+x
          \( -name 'system.*' -o -name 'os-supervisor' \) | sort | head -4)

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-asan
      - name: Build
        run: cmake --build --preset host-asan --parallel 2
      - name: Test M0 only
        run: ctest --preset host-asan --output-on-failure -L '^m0$'

  clang-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/host-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/host-clang --parallel 2
      - name: Test M0 only
        run: ctest --test-dir build/host-clang --output-on-failure -L '^m0$'

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          -DEMNL_BUILD_FUZZING=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: .github/scripts/run-build.sh 'fuzz-smoke' build/fuzz --parallel 2
      # Every target, with leak detection on. A leak in a parser reachable from
      # untrusted input is a denial-of-service surface, not untidiness.
      - name: Fuzz smoke
        run: >-
          .github/scripts/run-fuzz-smoke.sh build/fuzz
          ipc_decoder_fuzz=1000
          osidlc_compiler_fuzz=1000
          rpc_error_fuzz=1000
          package_manifest_fuzz=5000
          storage_relative_path_fuzz=5000
          boot_state_fuzz=5000
          device_access_fuzz=5000
          time_protection_fuzz=5000

  arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Record machine
        run: |
          uname -a
          uname -m | tee arm64-machine.txt
          test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build complete userspace natively on AArch64
        run: cmake --build --preset host-debug --parallel 2
      - name: Test M0 natively on AArch64
        run: ctest --preset host-debug --output-on-failure -L '^m0$'

  arm64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross compiler and QEMU user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-g++ --version | head -1
          qemu-aarch64 --version | head -1
      - name: Build host OSIDL compiler
        run: |
          cmake --preset host-tools
          cmake --build --preset host-tools --target osidlc --parallel 2
          ./build/host-tools/tools/osidlc/osidlc --version
      - name: Configure AArch64 cross build
        run: cmake --preset arm64-debug
      - name: Cross-build complete userspace
        shell: bash
        run: |
          set +e
          cmake --build --preset arm64-debug --parallel 2 > cross-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- compact cross-build diagnostics ---'
            grep -nE '(^| )(error:|fatal error:|warning:)' cross-build.log | tail -120 || true
            echo '--- final build lines ---'
            tail -40 cross-build.log
            exit "$status"
          fi
          cat cross-build.log
      - name: Run QEMU-user-safe M0 AArch64 tests
        run: >-
          ctest --preset arm64-debug --output-on-failure
          -L '^m0$' -E 'supervisor_|sandbox_landlock_test'
