name: M2 Key Service

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  keys-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
      - name: Build key foundation and AEAD gate
        run: >-
          cmake --build --preset host-debug
          --target key_registry_test key_random_id_source_test key_service_identity_test key_service_aead_test
          --parallel 2
      - name: Test key foundation and AEAD gate
        run: ctest --preset host-debug --output-on-failure -R '^key_'

  keys-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build/m2-keys-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build key foundation and AEAD gate
        run: >-
          cmake --build build/m2-keys-clang
          --target key_registry_test key_random_id_source_test key_service_identity_test key_service_aead_test
          --parallel 2
      - name: Test key foundation and AEAD gate
        run: ctest --test-dir build/m2-keys-clang --output-on-failure -R '^key_'

  keys-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Install crypto test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake --preset host-debug -DEMNL_BUILD_OPENSSL_TEST_PROVIDER=ON
      - name: Build key foundation and AEAD gate natively
        run: >-
          cmake --build --preset host-debug
          --target key_registry_test key_random_id_source_test key_service_identity_test key_service_aead_test
          --parallel 2
      - name: Test key foundation and AEAD gate natively
        run: ctest --preset host-debug --output-on-failure -R '^key_'
