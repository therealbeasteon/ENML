name: M2 Key Service

on:
  push:
  pull_request:

jobs:
  keys-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-debug
      - name: Build key foundation
        run: >-
          cmake --build --preset host-debug
          --target key_registry_test key_random_id_source_test key_service_identity_test
          --parallel 2
      - name: Test key foundation
        run: ctest --preset host-debug --output-on-failure -R '^key_'

  keys-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/m2-keys-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build key foundation
        run: >-
          cmake --build build/m2-keys-clang
          --target key_registry_test key_random_id_source_test key_service_identity_test
          --parallel 2
      - name: Test key foundation
        run: ctest --test-dir build/m2-keys-clang --output-on-failure -R '^key_'

  keys-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AArch64
        run: test "$(uname -m)" = "aarch64"
      - name: Configure
        run: cmake --preset host-debug
      - name: Build key foundation natively
        run: >-
          cmake --build --preset host-debug
          --target key_registry_test key_random_id_source_test key_service_identity_test
          --parallel 2
      - name: Test key foundation natively
        run: ctest --preset host-debug --output-on-failure -R '^key_'
